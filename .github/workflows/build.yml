name: Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Сохраняем полную историю
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        # Сохраняем существующую структуру
        mkdir -p dist
        mkdir -p build
        # Собираем с сохранением архитектуры
        pyinstaller --onefile --windowed --clean text_diff_gui.py
        # Проверяем структуру после сборки
        dir dist
        dir build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: text-diff-executable
        path: |
          dist/text_diff_gui.exe
          build/
          TextDiff.spec
        retention-days: 5 